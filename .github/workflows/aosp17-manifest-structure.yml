name: AOSP17 manifest structure

on:
  push:
    branches:
      - port/a17-aosp17-manifest-20261102
  pull_request:
    paths:
      - aosp17_reference.xml
      - aosp17_pe_bootstrap.xml
      - aosp17_pe_envsetup.xml
      - aosp17_pe_p0_native.xml
      - aosp17_pe_p0_core.xml
      - aosp17_pe_p0_frameworks.xml
      - aosp17_pe_p0_recovery.xml
      - aosp17_pe_p0_av.xml
      - aosp17_pe_p0_base.xml
      - aosp17_pe_p0_hardware.xml
      - aosp17_pe_p0_bluetooth.xml
      - aosp17_pe_p0_connectivity.xml
      - aosp17_pe_p0_permission.xml
      - aosp17_pe_p0_wifi.xml
      - aosp17_pe_p0_adb.xml
      - .github/workflows/aosp17-manifest-structure.yml

permissions:
  contents: read

jobs:
  resolve-profiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: aosp17_reference.xml
            expected: 1068
          - profile: aosp17_pe_bootstrap.xml
            expected: 1068
          - profile: aosp17_pe_envsetup.xml
            expected: 1069
          - profile: aosp17_pe_p0_native.xml
            expected: 1069
          - profile: aosp17_pe_p0_core.xml
            expected: 1069
          - profile: aosp17_pe_p0_frameworks.xml
            expected: 1069
          - profile: aosp17_pe_p0_recovery.xml
            expected: 1069
          - profile: aosp17_pe_p0_av.xml
            expected: 1069
          - profile: aosp17_pe_p0_base.xml
            expected: 1069
          - profile: aosp17_pe_p0_hardware.xml
            expected: 1069
          - profile: aosp17_pe_p0_bluetooth.xml
            expected: 1069
          - profile: aosp17_pe_p0_connectivity.xml
            expected: 1069
          - profile: aosp17_pe_p0_permission.xml
            expected: 1069
          - profile: aosp17_pe_p0_wifi.xml
            expected: 1069
          - profile: aosp17_pe_p0_adb.xml
            expected: 1069
    steps:
      - name: Install official repo client
        run: |
          curl --fail --silent --show-error --location \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$RUNNER_TEMP/repo"
          chmod +x "$RUNNER_TEMP/repo"
      - name: Parse and export effective project graph without repo sync
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          mkdir -p "$RUNNER_TEMP/checkout"
          cd "$RUNNER_TEMP/checkout"
          "$RUNNER_TEMP/repo" init -q --no-clone-bundle \
            -u https://github.com/PixelExperience-Reborn/manifest \
            -b port/a17-aosp17-manifest-20261102 -m "$PROFILE"
          "$RUNNER_TEMP/repo" manifest -o "$RUNNER_TEMP/resolved.xml"
      - name: Validate no device-tree imports or old PE platform forks
        env:
          PROFILE: ${{ matrix.profile }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ["RUNNER_TEMP"] + "/resolved.xml").getroot()
          projects = root.findall(".//project")
          profile = os.environ["PROFILE"]
          expected = int(os.environ["EXPECTED"])
          paths = [p.get("path") or p.get("name") for p in projects]
          assert len(paths) == expected, (profile, len(paths), expected)
          assert len(set(paths)) == len(paths), "duplicate checkout path"
          # repo manifest exports default-selected projects; three Darwin
          # prebuilts explicitly use notdefault and are correctly excluded.
          for excluded in ("prebuilts/clang/host/darwin-x86",
                           "prebuilts/go/darwin-x86",
                           "prebuilts/rust-toolchain/darwin"):
              assert excluded not in paths, "notdefault Darwin prebuilt unexpectedly selected"

          indexed = {p.get("path") or p.get("name"): p for p in projects}
          assert indexed["build/make"].get("name") == "platform/build", "core Make is not AOSP17"
          for path in ("art", "bionic", "system/core"):
              project = indexed[path]
              if profile in ("aosp17_pe_p0_native.xml", "aosp17_pe_p0_core.xml", "aosp17_pe_p0_frameworks.xml", "aosp17_pe_p0_recovery.xml", "aosp17_pe_p0_av.xml", "aosp17_pe_p0_base.xml", "aosp17_pe_p0_hardware.xml", "aosp17_pe_p0_bluetooth.xml", "aosp17_pe_p0_connectivity.xml", "aosp17_pe_p0_permission.xml", "aosp17_pe_p0_wifi.xml", "aosp17_pe_p0_adb.xml") and path in ("art", "bionic"):
                  assert project.get("name") == path, path
                  expected_commit = {
                      "art": "b753cf97923c3695338d21466fa14c57b480a59a",
                      "bionic": "06356e41c5ed7b12220b24c05ba4fdb873b126a7",
                  }[path]
                  assert project.get("revision") == expected_commit, path
              elif profile in ("aosp17_pe_p0_core.xml", "aosp17_pe_p0_frameworks.xml", "aosp17_pe_p0_recovery.xml", "aosp17_pe_p0_av.xml", "aosp17_pe_p0_base.xml", "aosp17_pe_p0_hardware.xml", "aosp17_pe_p0_bluetooth.xml", "aosp17_pe_p0_connectivity.xml", "aosp17_pe_p0_permission.xml", "aosp17_pe_p0_wifi.xml", "aosp17_pe_p0_adb.xml") and path == "system/core":
                  assert project.get("name") == "system_core"
                  assert project.get("revision") == "8e0f22aaac0ee4114a83646e2c96d07578145bfa"
              else:
                  assert project.get("name").startswith("platform/"), path
          if profile in ("aosp17_pe_p0_frameworks.xml", "aosp17_pe_p0_recovery.xml", "aosp17_pe_p0_av.xml", "aosp17_pe_p0_base.xml", "aosp17_pe_p0_hardware.xml", "aosp17_pe_p0_bluetooth.xml", "aosp17_pe_p0_connectivity.xml", "aosp17_pe_p0_permission.xml", "aosp17_pe_p0_wifi.xml", "aosp17_pe_p0_adb.xml"):
              assert indexed["frameworks/native"].get("name") == "frameworks_native"
              assert indexed["frameworks/native"].get("revision") == "ae266dcb706d083868578cfedce381ef44488a07"
          else:
              assert indexed["frameworks/native"].get("name") == "platform/frameworks/native"
          if profile in ("aosp17_pe_p0_recovery.xml", "aosp17_pe_p0_av.xml", "aosp17_pe_p0_base.xml", "aosp17_pe_p0_hardware.xml", "aosp17_pe_p0_bluetooth.xml", "aosp17_pe_p0_connectivity.xml", "aosp17_pe_p0_permission.xml", "aosp17_pe_p0_wifi.xml", "aosp17_pe_p0_adb.xml"):
              assert indexed["bootable/recovery"].get("name") == "bootable_recovery"
              assert indexed["bootable/recovery"].get("revision") == "0ed8dc4f93020555afdfc19141263ca40629ef74"
          else:
              assert indexed["bootable/recovery"].get("name") == "platform/bootable/recovery"
          if profile in ("aosp17_pe_p0_av.xml", "aosp17_pe_p0_base.xml", "aosp17_pe_p0_hardware.xml", "aosp17_pe_p0_bluetooth.xml", "aosp17_pe_p0_connectivity.xml", "aosp17_pe_p0_permission.xml", "aosp17_pe_p0_wifi.xml", "aosp17_pe_p0_adb.xml"):
              assert indexed["frameworks/av"].get("name") == "frameworks_av"
              assert indexed["frameworks/av"].get("revision") == "5db9a6151f33cacb810a8fe7615be8c23d3fa858"
          else:
              assert indexed["frameworks/av"].get("name") == "platform/frameworks/av"
          framework_base = indexed["frameworks/base"]
          if profile in ("aosp17_pe_p0_base.xml", "aosp17_pe_p0_hardware.xml", "aosp17_pe_p0_bluetooth.xml", "aosp17_pe_p0_connectivity.xml", "aosp17_pe_p0_permission.xml", "aosp17_pe_p0_wifi.xml", "aosp17_pe_p0_adb.xml"):
              assert framework_base.get("name") == "frameworks_base"
              assert framework_base.get("revision") == "382d5c9c0b20bbdb67b70176bce02c7e64767b0c"
          else:
              assert framework_base.get("name") == "platform/frameworks/base"
          hardware = indexed["hardware/interfaces"]
          if profile in ("aosp17_pe_p0_hardware.xml", "aosp17_pe_p0_bluetooth.xml", "aosp17_pe_p0_connectivity.xml", "aosp17_pe_p0_permission.xml", "aosp17_pe_p0_wifi.xml", "aosp17_pe_p0_adb.xml"):
              assert hardware.get("name") == "hardware_interfaces", hardware.attrib
              assert hardware.get("revision") == "735e364cbdd00b0d6e4dc33ea0866dbb6d971a11", hardware.attrib
          else:
              assert hardware.get("name") == "platform/hardware/interfaces", hardware.attrib
          bluetooth = indexed["packages/modules/Bluetooth"]
          if profile in ("aosp17_pe_p0_bluetooth.xml", "aosp17_pe_p0_connectivity.xml", "aosp17_pe_p0_permission.xml", "aosp17_pe_p0_wifi.xml", "aosp17_pe_p0_adb.xml"):
              assert bluetooth.get("name") == "packages_modules_Bluetooth", bluetooth.attrib
              assert bluetooth.get("revision") == "e7c2f47e3c73c4f2b83f03145441e419f45124b3", bluetooth.attrib
          else:
              assert bluetooth.get("name") == "platform/packages/modules/Bluetooth", bluetooth.attrib
          connectivity = indexed["packages/modules/Connectivity"]
          if profile in ("aosp17_pe_p0_connectivity.xml", "aosp17_pe_p0_permission.xml", "aosp17_pe_p0_wifi.xml", "aosp17_pe_p0_adb.xml"):
              assert connectivity.get("name") == "packages_modules_Connectivity", connectivity.attrib
              assert connectivity.get("revision") == "701882b51546230c6c32c9654a3f7b9814429e13", connectivity.attrib
              assert connectivity.get("groups") == "pdk-cw-fs,pdk-fs", connectivity.attrib
          else:
              assert connectivity.get("name") == "platform/packages/modules/Connectivity", connectivity.attrib
          permission = indexed["packages/modules/Permission"]
          if profile in ("aosp17_pe_p0_permission.xml", "aosp17_pe_p0_wifi.xml", "aosp17_pe_p0_adb.xml"):
              assert permission.get("name") == "packages_modules_Permission", permission.attrib
              assert permission.get("revision") == "f6e6e14b5c4d6e094c205683940a1328384338d9", permission.attrib
              assert permission.get("groups") == "pdk-cw-fs,pdk-fs", permission.attrib
          else:
              assert permission.get("name") == "platform/packages/modules/Permission", permission.attrib
          wifi = indexed["packages/modules/Wifi"]
          if profile in ("aosp17_pe_p0_wifi.xml", "aosp17_pe_p0_adb.xml"):
              assert wifi.get("name") == "packages_modules_Wifi", wifi.attrib
              assert wifi.get("revision") == "f228be88b2f0b8ed7a39ca1c4db94bc5aaaecbce", wifi.attrib
              assert wifi.get("groups") == "pdk-cw-fs,pdk-fs,sysui-studio", wifi.attrib
          else:
              assert wifi.get("name") == "platform/packages/modules/Wifi", wifi.attrib
          adb = indexed["packages/modules/adb"]
          if profile == "aosp17_pe_p0_adb.xml":
              assert adb.get("name") == "packages_modules_adb", adb.attrib
              assert adb.get("revision") == "6daac89c0d6e395f9ff2a032206a21e04421dc5f", adb.attrib
              assert adb.get("groups") == "pdk", adb.attrib
          else:
              assert adb.get("name") == "platform/packages/modules/adb", adb.attrib
          assert not any(path.startswith("device/google/") or
                         path.startswith("device/linaro/") or
                         path.startswith("device/amlogic/") for path in paths)
          if profile == "aosp17_reference.xml":
              assert indexed["build/soong"].get("name") == "platform/build/soong"
              assert "vendor/aosp" not in indexed
          else:
              soong = indexed["build/soong"]
              assert soong.get("name") == "build_soong"
              assert soong.get("revision") == "6215d41c790a463b7795ce81ac77204c238cbf48"
              if profile in ("aosp17_pe_envsetup.xml", "aosp17_pe_p0_native.xml", "aosp17_pe_p0_core.xml", "aosp17_pe_p0_frameworks.xml", "aosp17_pe_p0_recovery.xml", "aosp17_pe_p0_av.xml", "aosp17_pe_p0_base.xml", "aosp17_pe_p0_hardware.xml", "aosp17_pe_p0_bluetooth.xml", "aosp17_pe_p0_connectivity.xml", "aosp17_pe_p0_permission.xml", "aosp17_pe_p0_wifi.xml", "aosp17_pe_p0_adb.xml"):
                  vendor = indexed["vendor/aosp"]
                  assert vendor.get("name") == "vendor_aosp"
                  assert len(vendor.get("revision", "")) == 40
              else:
                  assert "vendor/aosp" not in indexed
          print(f"PASS: {profile}: {len(paths)} projects, no duplicates, AOSP17 Make/ART/Bionic/core")
          PY
