name: AOSP17 P0 selected source sync

on:
  push:
    branches:
      - port/a17-aosp17-manifest-20261102
    paths:
      - .github/workflows/aosp17-p0-source-sync.yml
      - aosp17_pe_p0_av.xml
      - aosp17_pe_p0_base.xml
      - aosp17_pe_p0_hardware.xml
      - aosp17_pe_p0_bluetooth.xml
      - aosp17_pe_p0_connectivity.xml
      - aosp17_pe_p0_permission.xml
  pull_request:
    paths:
      - .github/workflows/aosp17-p0-source-sync.yml
      - aosp17_pe_p0_av.xml
      - aosp17_pe_p0_base.xml
      - aosp17_pe_p0_hardware.xml
      - aosp17_pe_p0_bluetooth.xml
      - aosp17_pe_p0_connectivity.xml
      - aosp17_pe_p0_permission.xml

permissions:
  contents: read

jobs:
  selected-source-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install official Android repo client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$RUNNER_TEMP/repo"
          chmod +x "$RUNNER_TEMP/repo"

      - name: Initialize the reviewed AOSP17 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checkout"
          cd "$RUNNER_TEMP/checkout"
          "$RUNNER_TEMP/repo" init -q --no-clone-bundle \
            -u https://github.com/PixelExperience-Reborn/manifest \
            -b port/a17-aosp17-manifest-20261102 \
            -m aosp17_pe_p0_permission.xml

      - name: Fetch fourteen pinned AOSP17 and PE P0 projects
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/checkout"
          "$RUNNER_TEMP/repo" sync --no-tags -c -j4 --fail-fast \
            build/make build/soong vendor/aosp art bionic system/core \
            frameworks/native bootable/recovery frameworks/av \
            frameworks/base hardware/interfaces \
            packages/modules/Bluetooth packages/modules/Connectivity \
            packages/modules/Permission

      - name: Prepare Java 17 for Bluetooth OPP source regression
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Confirm every checked-out source matches the pinned commit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/checkout"
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          expected = {
              "build/make": "5ce6f787337d0223710bf7d4a16dbe6d2a35f777",
              "build/soong": "6215d41c790a463b7795ce81ac77204c238cbf48",
              "vendor/aosp": "a044adac1f764ade01148cf7c09beda9df686d91",
              "art": "b753cf97923c3695338d21466fa14c57b480a59a",
              "bionic": "06356e41c5ed7b12220b24c05ba4fdb873b126a7",
              "system/core": "8e0f22aaac0ee4114a83646e2c96d07578145bfa",
              "frameworks/native": "ae266dcb706d083868578cfedce381ef44488a07",
              "bootable/recovery": "0ed8dc4f93020555afdfc19141263ca40629ef74",
              "frameworks/av": "5db9a6151f33cacb810a8fe7615be8c23d3fa858",
              "frameworks/base": "382d5c9c0b20bbdb67b70176bce02c7e64767b0c",
              "hardware/interfaces": "735e364cbdd00b0d6e4dc33ea0866dbb6d971a11",
              "packages/modules/Bluetooth": "e7c2f47e3c73c4f2b83f03145441e419f45124b3",
              "packages/modules/Connectivity": "701882b51546230c6c32c9654a3f7b9814429e13",
              "packages/modules/Permission": "f6e6e14b5c4d6e094c205683940a1328384338d9",
          }
          for project, sha in expected.items():
              assert Path(project).is_dir(), f"Missing checkout: {project}"
              current = subprocess.check_output(
                  ["git", "-C", project, "rev-parse", "HEAD"], text=True
              ).strip()
              assert current == sha, f"{project}: {current} != {sha}"
              print(f"PASS {project}: {current[:12]}")
          # Source checkout and C++ host tests are separate from a real Android build.
          subprocess.run(
              ["python3", "-m", "unittest", "discover", "-s",
               "frameworks/base/tests/host", "-p", "test_pe_*.py", "-v"],
              check=True,
          )
          subprocess.run(
              ["python3", "-m", "unittest", "discover", "-s",
               "hardware/interfaces/tests/host", "-p", "test_*.py", "-v"],
              check=True,
          )
          subprocess.run(
              ["python3", "-m", "unittest", "discover", "-s",
               "packages/modules/Bluetooth/tests/host", "-p", "test_*.py", "-v"],
              check=True,
          )
          # Connectivity is currently a zero-delta AOSP17 source mirror.
          # Guard against accidental reintroduction of deprecated A14 PE patches.
          traffic = Path("packages/modules/Connectivity/framework-t/src/android/net/TrafficStats.java").read_text()
          assert "LOGD = Log.isLoggable(TAG, Log.DEBUG)" in traffic, "AOSP17 debug policy regressed"
          tethering = Path(
              "packages/modules/Connectivity/Tethering/src/"
              "com/android/networkstack/tethering/TetheringConfiguration.java"
          ).read_text()
          check = tethering.split("public static boolean checkDunRequired(Context ctx)", 1)[1]
          check = check.split("public int getOffloadPollInterval()", 1)[0]
          assert "tm.isTetheringApnRequired()" in check, "AOSP17 carrier DUN check missing"
          # In AOSP17 these roles were moved to API-versioned packages;
          # preserve the managed-profile notification access protection.
          role_files = (
              "PermissionController/role-controller/java/com/android/role/controller/"
              "behavior/v31/CompanionDeviceWatchRoleBehavior.java",
              "PermissionController/role-controller/java/com/android/role/controller/"
              "behavior/v33/CompanionDeviceComputerRoleBehavior.java",
              "PermissionController/role-controller/java/com/android/role/controller/"
              "behavior/v33/CompanionDeviceAppStreamingRoleBehavior.java",
              "PermissionController/role-controller/java/com/android/role/controller/"
              "behavior/v34/CompanionDeviceGlassesRoleBehavior.java",
          )
          permission_root = Path("packages/modules/Permission")
          for role in role_files:
              source = (permission_root / role).read_text()
              assert "UserUtils.isManagedProfile(user, context)" in source, role
              assert "grantNotificationAccessForPackageAsUser" in source, role
          print("PASS: fourteen selected P0 projects synced and pinned")
          PY
