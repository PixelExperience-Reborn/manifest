name: AOSP17 P1 system BPF and BPF programs exact-tree sync

on:
  push:
    branches:
      - port/a17-aosp17-manifest-20261102
    paths:
      - aosp17_reference.xml
      - aosp17_pe_p1_timezonepicker.xml
      - .github/workflows/aosp17-p1-bpf-source-sync.yml
  pull_request:
    paths:
      - aosp17_reference.xml
      - aosp17_pe_p1_timezonepicker.xml
      - .github/workflows/aosp17-p1-bpf-source-sync.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-android17-bpf-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download Android repo launcher
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$RUNNER_TEMP/repo"
          chmod +x "$RUNNER_TEMP/repo"
      - name: Verify complete official source ownership from effective manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aosp"
          cd "$RUNNER_TEMP/aosp"
          "$RUNNER_TEMP/repo" init -q --no-clone-bundle --partial-clone \
            --clone-filter=blob:none \
            -u https://github.com/PixelExperience-Reborn/manifest \
            -b port/a17-aosp17-manifest-20261102 -m aosp17_pe_p1_timezonepicker.xml
          "$RUNNER_TEMP/repo" manifest -o "$RUNNER_TEMP/effective.xml"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          projects = {
              p.get("path") or p.get("name"): p.get("name")
              for p in ET.parse(Path(os.environ["RUNNER_TEMP"]) / "effective.xml").getroot().findall("project")
          }
          expected = {
              "system/bpf": "platform/system/bpf",
              "system/bpfprogs": "platform/system/bpfprogs",
              "system/netd": "platform/system/netd",
              "packages/modules/Connectivity": "platform/packages/modules/Connectivity",
              "packages/modules/NetworkStack": "platform/packages/modules/NetworkStack",
          }
          for path, name in expected.items():
              assert projects.get(path) == name, (path, projects.get(path))
          assert "system_bpf" not in projects.values(), "archived PE system_bpf unexpectedly selected"
          print("PASS: exact official AOSP17 BPF/netd/Connectivity source ownership")
          PY
      - name: Synchronize only system/bpf and system/bpfprogs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aosp"
          "$RUNNER_TEMP/repo" sync -c -j2 --no-tags --fail-fast system/bpf system/bpfprogs
      - name: Validate official Android17 trees, Rust loader and BPF program graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aosp"
          test "$(git -C system/bpf rev-parse 'HEAD^{tree}')" = "a02aa20523909870e9c3874931604ea061f2badb"
          test "$(git -C system/bpfprogs rev-parse 'HEAD^{tree}')" = "238924255acb29e72d0204ca66d4ea0792b84abb"
          python3 - <<'PY'
          from pathlib import Path

          bpf = Path("system/bpf")
          progs = Path("system/bpfprogs")
          bp = (bpf / "Android.bp").read_text()
          loaderbp = (bpf / "loader/Android.bp").read_text()
          loader = (bpf / "loader/bpfloader.rs").read_text()
          helperbp = (bpf / "progs/Android.bp").read_text()
          progsbp = (progs / "Android.bp").read_text()
          assert 'name: "bpf_cc_defaults"' in bp
          assert 'name: "android_bpf_defs"' in bp
          assert 'name: "bpf_prog_platform_headers"' in bp
          for item in ('rust_binary {', 'name: "bpfloader"', '"bpfloader.rs"',
                       '"libbpf_android_bindgen"', '"libandroid_bpfprogs_flags"',
                       '"liblibbpf_rs"', '"liblibbpf_sys"',
                       '"kernelWakelockDuration.bpf"', '"timeInState.bpf"',
                       '"dmabufIter.bpf"', '"bpfLockContention.bpf"'):
              assert item in loaderbp, item
          for item in ('struct BpfFileDesc', 'critical: bool', 'skip_on_user: bool',
                       'allow_missing: bool', 'min_kver', 'max_kver',
                       '"/system/etc/bpf/fuseMedia.bpf"',
                       '"/system/etc/bpf/cputimeinstate/timeInState.bpf"'):
              assert item in loader, item
          assert not (bpf / "bpfloader/BpfLoader.cpp").exists()
          assert not (bpf / "libbpf_android/Android.bp").exists()
          assert 'name: "bpfRingbufProg.bpf"' in helperbp
          for item in ('name: "timeInState.bpf"', 'name: "fuseMedia.bpf"',
                       'name: "dmabufIter.bpf"', 'name: "android_bpfprogs_flags"',
                       'name: "libandroid_bpfprogs_flags"'):
              assert item in progsbp, item
          for filename in ("timeInState.c", "fuseMedia.c", "dmabufIter.c", "progs.aconfig"):
              assert (progs / filename).is_file(), filename
          print("PASS: tagged AOSP17 system/bpf and system/bpfprogs exact trees and source-only Rust/BPF graph")
          print("NOT TESTED: Rust/Soong or BPF compiler, device 5.10 kernel/SELinux/netd, mondrian boot")
          PY
