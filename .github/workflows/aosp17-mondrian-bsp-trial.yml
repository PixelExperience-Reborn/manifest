name: AOSP17 mondrian opt-in LF BSP trial graph resolution

on:
  push:
    branches: ['bringup/a17-mondrian-audit-profile-20261108']
    paths:
      - aosp17_pe_mondrian_bsp_trial.xml
      - tools/check_mondrian_bsp_trial_profile.py
      - .github/workflows/aosp17-mondrian-bsp-trial.yml
  pull_request:
    paths:
      - aosp17_pe_mondrian_bsp_trial.xml
      - tools/check_mondrian_bsp_trial_profile.py
      - .github/workflows/aosp17-mondrian-bsp-trial.yml

permissions:
  contents: read

jobs:
  source-graph-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone source-trial policy
        run: python3 tools/check_mondrian_bsp_trial_profile.py
      - name: Install official repo client
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$RUNNER_TEMP/repo"
          chmod +x "$RUNNER_TEMP/repo"
      - name: Resolve full AOSP17 manifest project graph, without huge sync
        run: |
          mkdir -p "$RUNNER_TEMP/mondrian-bsp"
          cd "$RUNNER_TEMP/mondrian-bsp"
          "$RUNNER_TEMP/repo" init -q --no-clone-bundle \
            -u https://github.com/PixelExperience-Reborn/manifest \
            -b bringup/a17-mondrian-audit-profile-20261108 \
            -m aosp17_pe_mondrian_bsp_trial.xml
          "$RUNNER_TEMP/repo" manifest -o "$RUNNER_TEMP/merged.xml"
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import os
          root = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "merged.xml").getroot()
          all_projects = root.findall("project")
          paths = [p.get("path") or p.get("name") for p in all_projects]
          assert len(paths) == len(set(paths)), "collision in checkout paths"
          p = {x.get("path") or x.get("name"): x for x in all_projects}
          expected = {
              "kernel/xiaomi/sm8450": "283772ceb84491fd446e340fd211d45fb9dd9a36",
              "kernel/xiaomi/sm8450-modules": "91cdb1347970ae98291986926eb16bf1b172138e",
              "kernel/xiaomi/sm8450-devicetrees": "99f1330d8dce0c80de5a19f425d0a118b2eb7fe3",
          }
          for path, sha in expected.items():
              assert path in p, f"{path}: not exported by repo manifest"
              assert p[path].get("revision") == sha, f"{path}: commit drift"
              assert p[path].get("name").startswith("android_kernel_xiaomi_sm8450"), "wrong BSP repository"
          for path in ("device/xiaomi/mondrian", "device/xiaomi/sm8450-common", "vendor/aosp", "build/make"):
              assert path in p, f"{path}: required AOSP17 PE source missing"
          for path in ("vendor/xiaomi/mondrian", "vendor/xiaomi/sm8450-common", "hardware/xiaomi"):
              assert path not in p, f"{path}: unapproved proprietary/HAL project inserted"
          print(f"[PASS] Google repo graph with {len(all_projects)} projects, exact LF kernel/modules/DT pins")
          print("[NOTE] Source graph only. No kernel build, vendor modules, KMI, AVB or hardware test.")
          PY
