name: AOSP17 P1 system/vold exact source sync

on:
  push:
    branches:
      - port/a17-aosp17-manifest-20261102
    paths:
      - aosp17_pe_p1_vold.xml
      - .github/workflows/aosp17-p1-vold-source-sync.yml
  pull_request:
    paths:
      - aosp17_pe_p1_vold.xml
      - .github/workflows/aosp17-p1-vold-source-sync.yml

permissions:
  contents: read

jobs:
  source-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Fetch official Android repo launcher
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$RUNNER_TEMP/repo"
          chmod +x "$RUNNER_TEMP/repo"
      - name: Initialize isolated AOSP17 P1 vold manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aosp"
          cd "$RUNNER_TEMP/aosp"
          "$RUNNER_TEMP/repo" init -q --no-clone-bundle --partial-clone \
            --clone-filter=blob:none \
            -u https://github.com/PixelExperience-Reborn/manifest \
            -b port/a17-aosp17-manifest-20261102 -m aosp17_pe_p1_vold.xml
      - name: Sync only system/vold from immutable reviewed source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aosp"
          "$RUNNER_TEMP/repo" sync -c -j2 --no-tags --fail-fast system/vold
      - name: Verify original Google tree and unchanged FBE/storage source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aosp/system/vold"
          test "$(git rev-parse HEAD)" = "76516faf8c3bd5e0eb330611a40793cd137f1f8a"
          test "$(git rev-parse 'HEAD^{tree}')" = "8a39be56cc76830d199878b5ea854022a71d3af2"
          python3 - <<'PY'
          from pathlib import Path
          fscrypt = Path("FsCrypt.cpp").read_text()
          storage = Path("KeyStorage.cpp").read_text()
          metadata = Path("MetadataCrypt.cpp").read_text()
          idle = Path("IdleMaint.cpp").read_text()
          assert "get_volume_file_encryption_options(" in fscrypt
          assert "KM_TAG_FBE_ICE" not in fscrypt
          assert "KM_TAG_FBE_ICE" not in storage
          assert "fscrypt_mount_metadata_encrypted(" in metadata
          assert "is_metadata_wrapped_key_supported(" not in metadata
          assert "int RunIdleMaint(" in idle
          assert "void Trim(" in idle
          print("PASS: AOSP17 FBE, metadata encryption and idle-maintenance source intact")
          PY
          echo "PASS: exact official vold Git tree and pinned snapshot"
